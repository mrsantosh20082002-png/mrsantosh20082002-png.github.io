        <div class="timer-text">

        </div>

        <!-- एक्यूरेसी बैज -->
        <div class="accuracy-badge">

        <!-- आगामी टिप कॉल टू एक्शन -->
        <div class="cta-tip">

        <!-- टेलीग्राम चैनल लिंक बटन -->
        <a href="https://t.me/+upHfffX6lDpjM2Fl" class="telegram-btn">

    <script>
        // 21 सेकंड का उल्टी गिनती (Countdown) टाइमर लूप
        const countdownElement = document.getElementById('countdown');
        let timeLeft = 21;

        setInterval(() => {
            timeLeft--;
            if (timeLeft < 0) {
                timeLeft = 21; // दोबारा 21 से शुरू करने के लिए
            }
            countdownElement.textContent = timeLeft;
        }, 1000);
